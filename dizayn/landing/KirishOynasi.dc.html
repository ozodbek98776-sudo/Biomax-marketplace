<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Onest', system-ui, sans-serif; background: #FBF9F8; }
    a { color: #C62828; text-decoration: none; } a:hover { color: #A31F1F; }
  </style>
</helmet>

<!-- Mehmon "Savatga" ni bosganda: savatga qo'shilmaydi, shu oyna ochiladi.
     Tanlangan mahsulot ESLAB QOLINADI — ro'yxatdan o'tgach avtomatik
     savatga tushadi, mijoz qidirib qaytmaydi. -->
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #FBF9F8; color: #1A1416">

  <!-- Orqa fon: trenddagi mahsulotlar bo'limi (xiralashgan) -->
  <div style="position: absolute; inset: 0">
    <div style="height: 72px; border-bottom: 1px solid #E6DEDD; background: #FFFFFF"></div>
    <div style="width: 1200px; margin: 0 auto; padding-top: 64px">
      <div style="width: 360px; height: 40px; border-radius: 10px; background: #E9E3E1"></div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; margin-top: 40px">
        <div style="height: 420px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E6DEDD"></div>
        <div style="height: 420px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E6DEDD"></div>
        <div style="height: 420px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E6DEDD"></div>
        <div style="height: 420px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E6DEDD"></div>
      </div>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(26,20,22,.52)"></div>

  <!-- Oyna -->
  <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 460px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 40px 90px -30px rgba(0,0,0,.55); overflow: hidden">

    <div style="display: flex; justify-content: flex-end; padding: 14px 14px 0">
      <span style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A6C70" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </span>
    </div>

    <div style="padding: 0 36px 32px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px">
      <span style="width: 64px; height: 64px; border-radius: 20px; background: #FDECEA; display: flex; align-items: center; justify-content: center">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
      </span>
      <h2 style="margin: 4px 0 0; font-size: 25px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance">Buyurtma berish uchun ro‘yxatdan o‘ting</h2>
      <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #4A3F43; text-wrap: pretty">Faqat ism va telefon raqami. Ro‘yxatdan o‘tgach tanlagan mahsulotingiz savatingizda turadi.</p>

      <!-- Tanlangan mahsulot — yo'qolmasligini ko'rsatadi -->
      <div style="align-self: stretch; display: flex; align-items: center; gap: 12px; padding: 12px; margin-top: 4px; background: #FBF9F8; border: 1px solid #E6DEDD; border-radius: 14px; text-align: left">
        <span style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 11px; background: linear-gradient(150deg, #F7F1EF, #ECE3E0); display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C9B8B4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 4v14H6Z"/><path d="M9 8h6M9 12h6"/></svg>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 500">Ariel avtomat kukuni, 6 kg</span>
          <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">128 000 so‘m</span>
        </span>
        <span style="font-size: 11.5px; font-weight: 600; color: #2F7D5D; background: #E6F2EC; padding: 4px 10px; border-radius: 999px; white-space: nowrap">Saqlanadi</span>
      </div>

      <div style="align-self: stretch; display: flex; flex-direction: column; gap: 10px; margin-top: 8px">
        <span style="height: 52px; display: flex; align-items: center; justify-content: center; background: #C62828; color: #FFFFFF; border-radius: 14px; font-size: 16px; font-weight: 600">Ro‘yxatdan o‘tish</span>
        <span style="height: 52px; display: flex; align-items: center; justify-content: center; border: 1px solid #E6DEDD; color: #1A1416; border-radius: 14px; font-size: 16px; font-weight: 600">Hisobim bor — kirish</span>
      </div>
      <span style="font-size: 13px; color: #7A6C70">Narxlarni ro‘yxatdan o‘tmasdan ham ko‘ra olasiz</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
